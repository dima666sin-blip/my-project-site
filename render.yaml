services:
  - type: web
    name: telegram-order-site
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        value: "8976917219"
